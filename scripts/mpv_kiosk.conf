# Input bindings for the unattended installation. Used with --no-input-default-bindings,
# which disables EVERYTHING mpv normally binds (seeking, volume, fullscreen toggle, frame
# stepping...) — this file is then the only thing that does anything at all.
#
# Deliberately tiny, but it MUST include a way out: locking every key means the only
# escape is pkill from another terminal, which is a bad place to be with a projector
# running and no keyboard shortcut that works.
SPACE cycle pause
q quit
ESC quit
